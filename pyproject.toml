[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-mind"
version = "0.1.0"
description = "Plug-and-play knowledge store for agents — SQLite, MCP, semantic search"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3.0",
    "fastembed",
    "uvicorn>=0.31",
    # Embedding R/W through OpenRouter (OpenAI-compatible endpoint) — checked
    # at adding per RULES.md A06; huey is the embed worker's queue on SQLite.
    "openai>=3.60",
    "huey>=3.5.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
open-mind = "openmind.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openmind"]
# The schema is data, not Python; without this a wheel ships without it.
artifacts = ["src/openmind/schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
