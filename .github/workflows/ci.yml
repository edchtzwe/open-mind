name: ci

# Draft PRs report a failure without running tests: a skipped required check
# would count as passing. Mark the PR ready to run the full suite against
# GitHub's proposed merge; subsequent pushes to a ready PR run it again.
# merge_group remains supported if the repository gains a merge queue.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

concurrency:
  # Draft events must not cancel a ready-for-review test run.
  group: ci-${{ github.event_name }}-${{ github.ref }}-${{ github.event.pull_request.draft }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    # The name branch protection requires. Renaming it breaks the gate.
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Block draft PRs
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == true
        run: |
          echo 'Draft PR: mark ready for review to run the full test suite.'
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # --no-deps because the suite imports only the standard library; drop it
      # the moment a test imports mcp, fastembed or uvicorn.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -e .
          pip install pytest

      - name: Tests
        run: python -m pytest -q
